name: Unit Tests & Code Quality

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check src tests evals

      - name: Type Check (mypy)
        run: uv run mypy src evals

      - name: Run Deterministic Invariants
        run: uv run pytest -v

      - name: Run Deterministic Offline Evals
        run: uv run agentic-emailer-eval --mode deterministic
